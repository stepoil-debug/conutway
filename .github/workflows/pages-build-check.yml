name: Validar build e navegação do CONUTWAY

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar referências preservadas
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/fix/pages-bundle-integrity:refs/remotes/origin/fix/pages-bundle-integrity
          git fetch --no-tags origin refs/heads/backup/login-premium-failed-20260810:refs/remotes/origin/backup/login-premium-failed-20260810

      - name: Reconstruir frontend
        run: python3 .github/scripts/recover_pages.py _site

      - name: Preparar GitHub Pages
        run: python3 .github/scripts/prepare_pages.py _site

      - name: Instalar hero e logo preservados do login
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          python3 - <<'PY'
          from pathlib import Path
          import base64, subprocess
          raw = subprocess.check_output([
              'git','show','origin/backup/login-premium-failed-20260810:.github/pages/conutway-brazil-china-hero-v2.webp.b64'
          ])
          hero = base64.b64decode(raw, validate=False)
          assert len(hero) == 105456, f'hero com tamanho inesperado: {len(hero)}'
          assert hero[:4] == b'RIFF' and hero[8:12] == b'WEBP'
          Path('_site/assets/conutway-brazil-china-hero.webp').write_bytes(hero)
          logo = subprocess.check_output([
              'git','show','origin/backup/login-premium-failed-20260810:.github/pages/conutway-teza-logo-v2.svg'
          ]).decode('utf-8')
          assert '<svg' in logo and 'CONUTWAY' in logo and 'TEZA' in logo
          Path('_site/assets/conutway-teza-logo-v2.svg').write_text(logo, encoding='utf-8')
          print('hero_ok bytes=', len(hero))
          print('logo_ok chars=', len(logo))
          PY

      - name: Validar arquivos finais
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html login.html 404.html app.js styles.css storage.js permissions.js; do test -s "_site/$f"; done
          test -s _site/assets/conutway-brazil-china-hero.webp
          test -s _site/assets/conutway-teza-logo-v2.svg
          grep -q '<base href="/conutway/">' _site/index.html
          grep -q 'id="pagesAuthGuard"' _site/index.html
          grep -q 'id="pagesLogoutHandler"' _site/index.html
          grep -q 'id="loginForm"' _site/login.html
          grep -q 'target-v2-backup-hero' _site/login.html
          grep -q 'conutway-brazil-china-hero.webp' _site/login.html
          grep -q 'conutway-teza-logo-v2.svg' _site/login.html
          grep -q 'class="hero-image"' _site/login.html
          grep -q 'class="brand-logo"' _site/login.html
          grep -q 'Controle internacional.' _site/login.html
          grep -q 'Decisões mais seguras.' _site/login.html
          grep -q "username!=='admin'||password!=='admin'" _site/login.html
          grep -q "sessionStorage.setItem('conutway.auth.v1'" _site/login.html
          grep -q 'const serverStorageAllowed = () => false;' _site/app.js
          grep -q 'username: "admin"' _site/app.js
          node --check _site/app.js
          node --check _site/storage.js
          node --check _site/permissions.js
          echo "files=$(find _site -type f | wc -l)"
          du -sh _site

      - name: Preparar navegador de teste
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Auditar login e navegação no build local
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/conutway-www && mkdir -p /tmp/conutway-www/conutway
          cp -a _site/. /tmp/conutway-www/conutway/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/conutway-www >/tmp/conutway-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/conutway/login.html >/dev/null; then READY=1; break; fi
            sleep 0.25
          done
          test "$READY" -eq 1
          cp .github/scripts/pages-login-audit.mjs .github/scripts/local-pages-login-audit.mjs
          sed -i 's#https://stepoil-debug.github.io/conutway/#http://127.0.0.1:4173/conutway/#g' .github/scripts/local-pages-login-audit.mjs
          node .github/scripts/local-pages-login-audit.mjs

      - name: Guardar evidências da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conutway-pr-login-audit
          path: |
            pages-login-audit.json
            pages-login-audit.png
          if-no-files-found: warn
          retention-days: 7
