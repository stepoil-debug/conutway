name: Validar build estático do CONUTWAY

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar partes históricas do pacote
        shell: bash
        run: |
          set -euo pipefail
          COMMITS=(
            2fd2a98a477c871c73b6c688e43fed3e542ec439
            6c228e307779c9d6c8ae722377d7de369f9f2131
            b0b074f5eca193bd49ffc8ead8ab75f10cc1e345
            466c1f244f57d2c02b1f51715e8b8c08ccdd9eb2
            c2c41af851dcb446a19af82d21a312e448656061
            36d230a447d981b45f7a644cb42f55775db211e1
            f1fa09d710ae6b1b8e76f55c8adcf5f8f34a7920
            c3fc96fd4965d18e4b9a8af55df7b3758cdf028e
            f0cc8a7317cd6075b348ca775d5192ebb1a7a938
            a5307fc43f74750fc96b72258d3b84785b5b2e30
            ef14e8fc0ff4aef4a630136e41259e573e98f2c6
            27b363adc30221661bd3a4056d9075d0bb71c441
            664c44a6f5ee1ab302b1be0fa89c3a43c3a64852
            e6da8fc4d91dcb75bbb8f20be916829ee92dc0e3
            68480bd9d4b0b5babcd1a0a0b6cb6ce90e802926
            88e3eb8d597195defe2c4b2fad4f0f6011067fd2
            15846ec7cfd5b92d2d2df9b9a2cf53e12bfb0c49
            b8fc843661ff672b6247a6562fb6f735b58661a2
            5d1d1c7035b793e0531208fa139b510748461a21
            0ce80cf0cc0cf6aa0c52671f444f5090115637ca
            42565f1e1dc9341929b279ab5fa7988837c50ee9
          )
          i=0
          for sha in "${COMMITS[@]}"; do
            git fetch --no-tags origin "$sha:refs/archive/package-$i"
            i=$((i+1))
          done
          mapfile -t REFS < <(git for-each-ref --format='%(refname)' 'refs/archive/package-*' | sort -V)
          echo "Refs recuperados: ${#REFS[@]}"
          test "${#REFS[@]}" -eq "${#COMMITS[@]}"

          mapfile -t PATHS < <(for ref in "${REFS[@]}"; do git ls-tree -r --name-only "$ref" .bootstrap; done | grep -E '^\.bootstrap/part-[0-9]+$' | sort -Vu)
          echo "Partes encontradas: ${#PATHS[@]}"
          printf '%s\n' "${PATHS[@]}"
          test "${#PATHS[@]}" -ge 25

          : > /tmp/site.b64
          VALIDAS=0
          for path in "${PATHS[@]}"; do
            conteudo=""
            for ref in "${REFS[@]}"; do
              if git cat-file -e "$ref:$path" 2>/dev/null; then
                candidato="$(git show "$ref:$path" | tr -d '\r\n\t ')"
                if [ -n "$candidato" ] && [ "$candidato" != "PLACEHOLDER" ] && printf '%s' "$candidato" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
                  conteudo="$candidato"
                  break
                fi
              fi
            done
            if [ -n "$conteudo" ]; then
              printf '%s' "$conteudo" >> /tmp/site.b64
              VALIDAS=$((VALIDAS+1))
            fi
          done
          echo "Partes válidas: $VALIDAS"
          base64 --decode /tmp/site.b64 > /tmp/site.xz
          echo "XZ: $(stat -c%s /tmp/site.xz) bytes"
          xz -t /tmp/site.xz
          xz -dc /tmp/site.xz > /tmp/site.bin

          rm -rf restaurado && mkdir restaurado
          if tar -tf /tmp/site.bin >/dev/null 2>&1; then
            tar -xf /tmp/site.bin -C restaurado
          elif unzip -tq /tmp/site.bin >/dev/null 2>&1; then
            unzip -q /tmp/site.bin -d restaurado
          else
            file /tmp/site.bin || true
            exit 1
          fi

          APP_INDEX="$(find restaurado -type f -path '*/app/index.html' | sort | head -n 1 || true)"
          if [ -z "$APP_INDEX" ]; then APP_INDEX="$(find restaurado -type f -name index.html | sort | head -n 1 || true)"; fi
          test -n "$APP_INDEX"
          APP_DIR="$(dirname "$APP_INDEX")"
          echo "Frontend: $APP_DIR"
          rm -rf _site && mkdir _site
          cp -a "$APP_DIR"/. _site/
          rm -f _site/server.js _site/rfq-server-service.js _site/workspace-rfq-client.js _site/docker-compose.yml _site/start-conutway-br-erp.sh _site/README.md
          rm -rf _site/tools _site/node_modules _site/data _site/secure _site/uploads _site/exports _site/backup _site/deployment
          touch _site/.nojekyll

      - name: Preparar modo GitHub Pages
        run: python3 .github/scripts/prepare_pages.py _site

      - name: Validar site final
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html 404.html app.js styles.css storage.js permissions.js; do test -s "_site/$f"; done
          grep -q '<base href="/conutway/">' _site/index.html
          grep -q 'const serverStorageAllowed = () => false;' _site/app.js
          node --check _site/app.js
          node --check _site/storage.js
          node --check _site/permissions.js
          echo "Arquivos finais: $(find _site -type f | wc -l)"
          du -sh _site
