name: Validar bundle de integridade do CONUTWAY

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspecionar e reconstruir bundle
        shell: bash
        run: |
          set -euo pipefail
          REF='origin/fix/pages-bundle-integrity'
          mapfile -t PARTS < <(git ls-tree -r --name-only "$REF" .pages-bundle | grep -E '^\.pages-bundle/part-[0-9]+$' | sort -V)
          echo "Partes: ${#PARTS[@]}"
          printf '%s\n' "${PARTS[@]}"
          test "${#PARTS[@]}" -ge 2
          : > /tmp/all.b64
          for part in "${PARTS[@]}"; do
            git show "$REF:$part" | tr -d '\r\n\t ' > /tmp/current
            echo "--- $part --- bytes=$(wc -c < /tmp/current) equals=$(tr -cd '=' < /tmp/current | wc -c)"
            printf 'head='; head -c 20 /tmp/current; echo
            printf 'tail='; tail -c 20 /tmp/current; echo
            if LC_ALL=C grep -q '[^A-Za-z0-9+/=]' /tmp/current; then
              echo "INVALID $part"
              exit 1
            fi
            cat /tmp/current >> /tmp/all.b64
          done
          echo "total=$(wc -c < /tmp/all.b64) mod4=$(( $(wc -c < /tmp/all.b64) % 4 ))"
          base64 --decode /tmp/all.b64 > /tmp/site.xz
          echo "xz_bytes=$(wc -c < /tmp/site.xz)"
          xz -t /tmp/site.xz
