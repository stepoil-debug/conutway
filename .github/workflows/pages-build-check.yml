name: Validar recuperação do frontend CONUTWAY

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar TAR a partir do bootstrap preservado
        shell: bash
        run: |
          set -euo pipefail
          REF='origin/main'
          mapfile -t PARTS < <(git ls-tree -r --name-only "$REF" .bootstrap | grep -E '^\.bootstrap/part-[0-9]+$' | sort -V)
          : > /tmp/bootstrap.b64
          for part in "${PARTS[@]}"; do
            content="$(git show "$REF:$part" | tr -d '\r\n\t ')"
            if [ "$content" = "PLACEHOLDER" ]; then
              echo "Ignorando placeholder: $part"
              continue
            fi
            printf '%s' "$content" >> /tmp/bootstrap.b64
          done

          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma
          s = Path('/tmp/bootstrap.b64').read_text().strip()
          s += '=' * ((-len(s)) % 4)
          raw = base64.b64decode(s, validate=True)
          if not raw.startswith(b'\xfd7zXZ\x00'):
              raise SystemExit('Bootstrap não inicia com cabeçalho XZ.')
          dec = lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
          out = dec.decompress(raw)
          print('base64_chars=', len(s), 'xz_bytes=', len(raw), 'tar_bytes_recuperados=', len(out), 'xz_eof=', dec.eof)
          if len(out) < 100000:
              raise SystemExit('Conteúdo recuperado é pequeno demais.')
          Path('/tmp/recovered.tar').write_bytes(out)
          PY
          file /tmp/recovered.tar

      - name: Extrair membros completos do TAR truncado
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/recovered && mkdir -p /tmp/recovered
          set +e
          tar -xvf /tmp/recovered.tar -C /tmp/recovered --ignore-zeros --warning=no-unknown-keyword >/tmp/tar-extract.log 2>&1
          TAR_CODE=$?
          set -e
          echo "tar_exit=$TAR_CODE"
          tail -40 /tmp/tar-extract.log || true
          echo "Arquivos extraídos: $(find /tmp/recovered -type f | wc -l)"
          find /tmp/recovered -maxdepth 3 -type f | sort | head -150

      - name: Validar frontend recuperado
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=/tmp/recovered/app
          test -d "$APP_DIR"
          for f in index.html app.js styles.css storage.js permissions.js; do
            echo "$f bytes=$(stat -c%s "$APP_DIR/$f" 2>/dev/null || echo 0)"
            test -s "$APP_DIR/$f"
          done
          node --check "$APP_DIR/app.js"
          node --check "$APP_DIR/storage.js"
          node --check "$APP_DIR/permissions.js"
          echo "index_head:"
          head -20 "$APP_DIR/index.html"
          echo "FRONTEND_RECUPERADO_OK"
