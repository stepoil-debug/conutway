name: Validar build e navegação do CONUTWAY

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar referências preservadas
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/fix/pages-bundle-integrity:refs/remotes/origin/fix/pages-bundle-integrity

      - name: Reconstruir frontend
        run: python3 .github/scripts/recover_pages.py _site

      - name: Preparar GitHub Pages
        run: python3 .github/scripts/prepare_pages_v9.py _site

      - name: Montar imagem enviada para o hero
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cat \
            .login-assets/v9b/part00.b64 \
            .login-assets/v9b/part01.b64 \
            .login-assets/v9b/part02.b64 \
            .login-assets/v9b/part03.b64 \
            .login-assets/v9b/part04.b64 \
            .login-assets/v9b/part05.b64 \
            .login-assets/v9b/part06.b64 \
            .login-assets/v9b/part07a.b64 \
            .login-assets/v9b/part07b.b64 \
            .login-assets/v9b/part08a.b64 \
            .login-assets/v9b/part08b.b64 \
            | tr -d '\r\n' | base64 --decode > _site/assets/conutway-hero-user-v9.webp
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b = Path('_site/assets/conutway-hero-user-v9.webp').read_bytes()
          assert len(b) == 49512, len(b)
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP'
          digest = hashlib.sha256(b).hexdigest()
          assert digest == '708d0186fe79455e3fe8e99da04830235b5082d3690436772031e3855a42e062', digest
          print('hero_usuario_ok bytes=', len(b), 'sha256=', digest)
          PY

      - name: Validar arquivos finais
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html login.html 404.html app.js styles.css storage.js permissions.js; do test -s "_site/$f"; done
          test -s _site/assets/conutway-hero-user-v9.webp
          grep -q '<base href="/conutway/">' _site/index.html
          grep -q 'id="pagesAuthGuard"' _site/index.html
          grep -q 'id="pagesLogoutHandler"' _site/index.html
          grep -q 'id="loginForm"' _site/login.html
          grep -q 'premium-user-hero-v9' _site/login.html
          grep -q 'conutway-hero-user-v9.webp' _site/login.html
          grep -q 'class="hero-image"' _site/login.html
          grep -q 'CONUTWAY' _site/login.html
          grep -q 'China ↔ Brasil' _site/login.html
          grep -q "username!=='admin'||password!=='admin'" _site/login.html
          grep -q "sessionStorage.setItem('conutway.auth.v1'" _site/login.html
          grep -q 'const serverStorageAllowed = () => false;' _site/app.js
          grep -q 'username: "admin"' _site/app.js
          node --check _site/app.js
          node --check _site/storage.js
          node --check _site/permissions.js
          echo "files=$(find _site -type f | wc -l)"
          du -sh _site

      - name: Preparar navegador de teste
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Auditar login e navegação no build local
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/conutway-www && mkdir -p /tmp/conutway-www/conutway
          cp -a _site/. /tmp/conutway-www/conutway/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/conutway-www >/tmp/conutway-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/conutway/login.html >/dev/null; then READY=1; break; fi
            sleep 0.25
          done
          test "$READY" -eq 1
          cp .github/scripts/pages-login-audit.mjs .github/scripts/local-pages-login-audit.mjs
          sed -i 's#https://stepoil-debug.github.io/conutway/#http://127.0.0.1:4173/conutway/#g' .github/scripts/local-pages-login-audit.mjs
          node .github/scripts/local-pages-login-audit.mjs

      - name: Guardar evidências da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conutway-pr-login-audit
          path: |
            pages-login-audit.json
            pages-login-audit.png
          if-no-files-found: warn
          retention-days: 7
