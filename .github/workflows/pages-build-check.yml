name: Diagnosticar pacote estático do CONUTWAY

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Medir pacote atual
        shell: bash
        run: |
          set -euo pipefail
          echo "b64_chars=$(wc -c < conutway-pages-ready.b64)"
          echo "b64_sha256=$(sha256sum conutway-pages-ready.b64 | awk '{print $1}')"
          echo "head=$(head -c 80 conutway-pages-ready.b64)"
          echo "tail=$(tail -c 80 conutway-pages-ready.b64)"
          if base64 --decode conutway-pages-ready.b64 > /tmp/site.zip 2>/tmp/decode.err; then
            echo "decode=ok"
            echo "zip_bytes=$(wc -c < /tmp/site.zip)"
            unzip -tq /tmp/site.zip
          else
            echo "decode=fail"
            cat /tmp/decode.err
            exit 1
          fi
