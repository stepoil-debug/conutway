name: Validar prefixo preservado do CONUTWAY

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calcular hash do bundle preservado
        shell: bash
        run: |
          set -euo pipefail
          REF='origin/fix/pages-bundle-integrity'
          mapfile -t PARTS < <(git ls-tree -r --name-only "$REF" .pages-bundle | grep -E '^\.pages-bundle/part-[0-9]+$' | sort -V)
          : > /tmp/prefix.b64
          for part in "${PARTS[@]}"; do git show "$REF:$part" | tr -d '\r\n\t ' >> /tmp/prefix.b64; done
          echo "chars=$(wc -c < /tmp/prefix.b64)"
          echo "sha256=$(sha256sum /tmp/prefix.b64 | awk '{print $1}')"
          echo "tail=$(tail -c 64 /tmp/prefix.b64)"
