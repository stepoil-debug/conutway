name: Publicar CONUTWAY no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'conutway-pages-ready.b64'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Reconstruir pacote estático
        shell: bash
        run: |
          set -euo pipefail
          test -s conutway-pages-ready.b64
          base64 --decode conutway-pages-ready.b64 > /tmp/conutway-pages-ready.zip
          unzip -tq /tmp/conutway-pages-ready.zip

      - name: Extrair site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          unzip -q /tmp/conutway-pages-ready.zip -d _site
          touch _site/.nojekyll
          if [ ! -s _site/404.html ]; then
            cp _site/index.html _site/404.html
          fi

      - name: Validar site
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/app.js
          test -s _site/styles.css
          grep -q '<base href="/conutway/">' _site/index.html
          grep -q 'const serverStorageAllowed = () => false;' _site/app.js
          node --check _site/app.js
          node --check _site/storage.js
          node --check _site/permissions.js
          echo "Arquivos do site: $(find _site -type f | wc -l)"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
