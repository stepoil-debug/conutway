name: Publicar CONUTWAY no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - 'conutway-pages-ready.b64'
      - '.github/pages/**'
      - '.github/scripts/recover_pages.py'
      - '.github/scripts/prepare_pages.py'
      - '.github/scripts/pages-login-audit.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar segmentos preservados
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/fix/pages-bundle-integrity:refs/remotes/origin/fix/pages-bundle-integrity

      - name: Reconstruir frontend completo
        run: python3 .github/scripts/recover_pages.py _site

      - name: Preparar modo GitHub Pages
        run: python3 .github/scripts/prepare_pages.py _site

      - name: Instalar identidade visual premium do login
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp .github/pages/conutway-teza-logo-v2.svg _site/assets/conutway-teza-logo-v2.svg
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          source = Path('.github/pages/conutway-brazil-china-hero-v2.svg')
          target = Path('_site/assets/conutway-brazil-china-hero-v2.webp')
          text = source.read_text(encoding='utf-8')
          match = re.search(r'href="data:image/webp;base64,([^\"]+)"', text, flags=re.S)
          if not match:
              raise SystemExit('WebP embutido não encontrado no SVG de origem')
          payload = base64.b64decode(re.sub(r'\s+', '', match.group(1)))
          if len(payload) < 20000 or payload[:4] != b'RIFF' or payload[8:12] != b'WEBP':
              raise SystemExit('Hero WebP extraído é inválido')
          target.write_bytes(payload)
          print(f'hero_webp_bytes={len(payload)}')
          PY

      - name: Validar site final e autenticação
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html login.html 404.html app.js styles.css storage.js permissions.js; do
            test -s "_site/$f"
          done
          test -s _site/assets/conutway-brazil-china-hero-v2.webp
          test -s _site/assets/conutway-teza-logo-v2.svg
          file _site/assets/conutway-brazil-china-hero-v2.webp | grep -qi 'Web/P image'
          grep -q '<base href="/conutway/">' _site/index.html
          grep -q 'id="pagesAuthGuard"' _site/index.html
          grep -q 'id="pagesLogoutHandler"' _site/index.html
          grep -q 'id="loginForm"' _site/login.html
          grep -q 'conutway-brazil-china-hero-v2.webp' _site/login.html
          grep -q 'conutway-teza-logo-v2.svg' _site/login.html
          grep -q "username!=='admin'||password!=='admin'" _site/login.html
          grep -q 'const serverStorageAllowed = () => false;' _site/app.js
          grep -q 'username: "admin"' _site/app.js
          node --check _site/app.js
          node --check _site/storage.js
          node --check _site/permissions.js
          echo "Arquivos finais: $(find _site -type f | wc -l)"
          du -sh _site

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-login:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar navegador de auditoria
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Testar login, hero e logout no site publicado
        run: node .github/scripts/pages-login-audit.mjs

      - name: Anexar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conutway-pages-login-audit
          path: |
            pages-login-audit.json
            pages-login-audit.png
          if-no-files-found: warn
          retention-days: 7