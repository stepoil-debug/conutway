name: Publicar CONUTWAY no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - 'conutway-pages-ready.b64'
      - '.github/pages/**'
      - '.login-assets/target-v2/**'
      - '.github/scripts/recover_pages.py'
      - '.github/scripts/prepare_pages.py'
      - '.github/scripts/apply_workspace_premium.py'
      - '.github/scripts/pages-login-audit.mjs'
      - '.github/scripts/documents-pages-audit.mjs'
      - '.github/scripts/pages-rfq-audit.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar referências preservadas
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/fix/pages-bundle-integrity:refs/remotes/origin/fix/pages-bundle-integrity
          git fetch --no-tags origin refs/heads/backup/login-premium-failed-20260810:refs/remotes/origin/backup/login-premium-failed-20260810

      - name: Reconstruir frontend completo
        run: python3 .github/scripts/recover_pages.py _site

      - name: Preparar modo GitHub Pages
        run: python3 .github/scripts/prepare_pages.py _site

      - name: Montar hero íntegro e logo do login
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, subprocess

          parts = [
              Path(f'.login-assets/target-v2/hero.part{i:02d}.b64')
              for i in range(10)
          ]
          raw = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          hero = base64.b64decode(raw, validate=True)
          digest = hashlib.sha256(hero).hexdigest()
          assert len(hero) == 73684, f'hero com tamanho inesperado: {len(hero)}'
          assert digest == '1e650b3040f2311192271a07e2247d774ca905039bc1fed6a2008c95e9a3048a', digest
          assert hero[:4] == b'RIFF' and hero[8:12] == b'WEBP', 'hero não é WebP válido'
          Path('_site/assets/conutway-brazil-china-hero.webp').write_bytes(hero)

          logo = subprocess.check_output([
              'git','show','origin/backup/login-premium-failed-20260810:.github/pages/conutway-teza-logo-v2.svg'
          ]).decode('utf-8')
          assert '<svg' in logo and 'CONUTWAY' in logo and 'TEZA' in logo
          Path('_site/assets/conutway-teza-logo-v2.svg').write_text(logo, encoding='utf-8')

          print('hero_ok bytes=', len(hero), 'sha256=', digest)
          print('logo_ok chars=', len(logo))
          PY

      - name: Aplicar interface interna premium
        run: python3 .github/scripts/apply_workspace_premium.py _site

      - name: Validar site final
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html login.html 404.html app.js styles.css storage.js permissions.js; do test -s "_site/$f"; done
          test -s _site/assets/conutway-brazil-china-hero.webp
          test -s _site/assets/conutway-teza-logo-v2.svg
          grep -q '<base href="/conutway/">' _site/index.html
          grep -q 'id="pagesAuthGuard"' _site/index.html
          grep -q 'id="pagesLogoutHandler"' _site/index.html
          grep -q 'data-workspace-theme="premium-v1"' _site/index.html
          grep -q 'CONUTWAY WORKSPACE PREMIUM V1' _site/styles.css
          grep -q 'assets/conutway-teza-logo-v2.svg' _site/index.html
          test "$(grep -o 'data-module-target=' _site/index.html | wc -l)" -eq 14
          grep -q 'id="loginForm"' _site/login.html
          grep -q 'target-v2-backup-hero' _site/login.html
          grep -q 'conutway-brazil-china-hero.webp' _site/login.html
          grep -q 'conutway-teza-logo-v2.svg' _site/login.html
          grep -q 'class="hero-image"' _site/login.html
          grep -q 'class="brand-logo"' _site/login.html
          grep -q 'Controle internacional.' _site/login.html
          grep -q 'Decisões mais seguras.' _site/login.html
          grep -q "username!=='admin'||password!=='admin'" _site/login.html
          grep -q "sessionStorage.setItem('conutway.auth.v1'" _site/login.html
          grep -q 'const serverStorageAllowed = () => false;' _site/app.js
          grep -q 'username: "admin"' _site/app.js
          node --check _site/app.js
          node --check _site/storage.js
          node --check _site/permissions.js
          echo "Arquivos finais: $(find _site -type f | wc -l)"
          du -sh _site

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-login:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 12
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar navegador de auditoria
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Testar visual, login, workspace e logout publicados
        run: node .github/scripts/pages-login-audit.mjs

      - name: Testar Documentos e Manuais publicados
        run: CONUTWAY_BASE=https://stepoil-debug.github.io/conutway/ node .github/scripts/documents-pages-audit.mjs

      - name: Testar RFQ Interno publicado
        run: CONUTWAY_BASE_URL=https://stepoil-debug.github.io/conutway/ node .github/scripts/pages-rfq-audit.mjs

      - name: Anexar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conutway-pages-functional-audit
          path: |
            pages-login-audit.json
            pages-login-audit.png
            pages-workspace-audit.png
            pages-workspace-collapsed-audit.png
            pages-workspace-projects-audit.png
            pages-workspace-po-audit.png
            pages-workspace-documents-audit.png
            pages-workspace-documents-functional-audit.png
            pages-workspace-rfq-audit.png
          if-no-files-found: warn
          retention-days: 7