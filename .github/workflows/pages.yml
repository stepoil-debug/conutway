name: Publicar CONUTWAY no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'conutway-pages-ready.zip'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.package.outputs.ready }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar pacote do ERP
        id: package
        shell: bash
        run: |
          if [ ! -s conutway-pages-ready.zip ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Pacote estático ainda não está no repositório. Aguardando conutway-pages-ready.zip.'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Extrair site
        if: steps.package.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          unzip -q conutway-pages-ready.zip -d _site
          touch _site/.nojekyll
          if [ ! -s _site/404.html ]; then
            cp _site/index.html _site/404.html
          fi

      - name: Validar site
        if: steps.package.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/app.js
          test -s _site/styles.css
          grep -q '<base href="/conutway/">' _site/index.html
          grep -q 'const serverStorageAllowed = () => false;' _site/app.js
          node --check _site/app.js
          node --check _site/storage.js
          node --check _site/permissions.js
          echo "Arquivos do site: $(find _site -type f | wc -l)"

      - name: Configurar GitHub Pages
        if: steps.package.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        if: steps.package.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
