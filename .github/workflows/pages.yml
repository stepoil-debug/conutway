name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Reconstruir pacote do site
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t PARTES < <(
            find .bootstrap -maxdepth 1 -type f \
              -regextype posix-extended \
              -regex '.*/part-[0-9]{2}' \
              -print | sort -V
          )

          if [ "${#PARTES[@]}" -eq 0 ]; then
            echo "Nenhuma parte válida foi encontrada em .bootstrap."
            exit 1
          fi

          echo "Partes encontradas: ${#PARTES[@]}"
          cat "${PARTES[@]}" | tr -d '\r\n\t ' | base64 --decode > pacote-site.xz
          xz -t pacote-site.xz
          xz -dc pacote-site.xz > pacote-site.bin

          rm -rf restaurado
          mkdir -p restaurado

          if tar -tf pacote-site.bin >/dev/null 2>&1; then
            tar -xf pacote-site.bin -C restaurado
          elif unzip -tq pacote-site.bin >/dev/null 2>&1; then
            unzip -q pacote-site.bin -d restaurado
          else
            echo "O pacote reconstruído não é um TAR ou ZIP reconhecido."
            file pacote-site.bin || true
            exit 1
          fi

      - name: Separar somente o frontend
        shell: bash
        run: |
          set -euo pipefail

          APP_INDEX="$(find restaurado -type f -path '*/app/index.html' | sort | head -n 1 || true)"
          if [ -z "$APP_INDEX" ]; then
            APP_INDEX="$(find restaurado -type f -name index.html -not -path '*/node_modules/*' | sort | head -n 1 || true)"
          fi
          if [ -z "$APP_INDEX" ]; then
            echo "Não foi localizado um index.html publicável."
            exit 1
          fi

          APP_DIR="$(dirname "$APP_INDEX")"
          echo "Frontend localizado em: $APP_DIR"

          rm -rf _site
          mkdir -p _site
          cp -a "$APP_DIR"/. _site/

          rm -f \
            _site/server.js \
            _site/rfq-server-service.js \
            _site/workspace-rfq-client.js \
            _site/docker-compose.yml \
            _site/start-conutway-br-erp.sh \
            _site/README.md

          rm -rf \
            _site/.git \
            _site/.github \
            _site/.bootstrap \
            _site/node_modules \
            _site/data \
            _site/secure \
            _site/uploads \
            _site/exports \
            _site/backup \
            _site/deployment

          find _site -type f \( \
            -name '.env' -o \
            -name '.env.*' -o \
            -name '*.log' -o \
            -name '*.sql' -o \
            -name '*.sqlite' -o \
            -name '*.sqlite3' -o \
            -name '*.db' \
          \) -delete

          touch _site/.nojekyll

      - name: Ativar modo local compatível com Pages
        run: python3 .github/scripts/prepare_pages.py _site

      - name: Validar publicação
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/app.js
          test -s _site/styles.css
          grep -q 'const serverStorageAllowed = () => false;' _site/app.js
          grep -q '<base href="/conutway/">' _site/index.html
          node --check _site/app.js
          node --check _site/storage.js
          node --check _site/permissions.js
          echo "Arquivos publicados: $(find _site -type f | wc -l)"
          echo "Tamanho total: $(du -sh _site | cut -f1)"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
