name: Publicar CONUTWAY no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - 'conutway-pages-ready.b64'
      - '.github/pages/**'
      - '.github/scripts/recover_pages.py'
      - '.github/scripts/prepare_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar segmentos preservados
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/fix/pages-bundle-integrity:refs/remotes/origin/fix/pages-bundle-integrity

      - name: Reconstruir frontend completo
        run: python3 .github/scripts/recover_pages.py _site

      - name: Preparar modo GitHub Pages
        run: python3 .github/scripts/prepare_pages.py _site

      - name: Validar site final e autenticação
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html login.html 404.html app.js styles.css storage.js permissions.js; do
            test -s "_site/$f"
          done
          grep -q '<base href="/conutway/">' _site/index.html
          grep -q 'id="pagesAuthGuard"' _site/index.html
          grep -q 'id="pagesLogoutHandler"' _site/index.html
          grep -q 'id="loginForm"' _site/login.html
          grep -q "username !== 'admin' || password !== 'admin'" _site/login.html
          grep -q 'const serverStorageAllowed = () => false;' _site/app.js
          grep -q 'username: "admin"' _site/app.js
          node --check _site/app.js
          node --check _site/storage.js
          node --check _site/permissions.js
          echo "Arquivos finais: $(find _site -type f | wc -l)"
          du -sh _site

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
